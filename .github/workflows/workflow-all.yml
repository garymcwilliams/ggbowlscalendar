name: GitHub CI with CodeCov and SQ
on:
  push:
    branches:
    - main
    paths:
    - '**.py'
    - '.coveragerc'
    - '.github/workflows/**'
    - README.md
    - pyproject.toml
    - poetry.lock
  pull_request:
    branches:
    - main
    paths:
    - '**.py'
    - '.coveragerc'
    - '.github/workflows/**'
    - README.md
    - pyproject.toml
    - poetry.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        poetry-version: [2.4.3]
        os: [ubuntu-26.04]
#        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ matrix.poetry-version }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: "${{ matrix.python-version }}"
        cache: 'poetry'
    - name: Cache deps
      id: cache-deps
      uses: actions/cache@v5
      with:
        path: .venv
        key: pydeps-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
    - name: Install Poetry dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
    - name: Install project dependencies
      run: poetry install --no-interaction
    - name: poetry in motion tests
      run: |
        poetry run coverage run -m pytest --junitxml=junit.xml
        poetry run coverage xml -i
    - name: Upload test results to Codecov
      if: ${{ !cancelled() && matrix.os == 'ubuntu-26.04' && matrix.python-version == '3.14' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: test_results
    - name: SonarCloud Scan
      if: ${{ !cancelled() && matrix.os == 'ubuntu-26.04' && matrix.python-version == '3.14' }}
      uses: sonarsource/sonarqube-scan-action@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}