name: GitHub CI with CodeCov and SQ

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '.coveragerc'
      - '.github/workflows/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'poetry.lock'

  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - '.coveragerc'
      - '.github/workflows/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'poetry.lock'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-24.04]
#        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: |
          poetry run coverage run -m pytest --junitxml=junit.xml
          poetry run coverage xml

      # Upload coverage from Python 3.14 only.
      # The other Python versions are still tested, but don't create
      # duplicate Codecov coverage reports.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.14' && matrix.os == 'ubuntu-24.04' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

      # Upload JUnit test results from Python 3.14 only.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.14' && matrix.os == 'ubuntu-24.04' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          report_type: test_results

      # Run SonarCloud once rather than once per Python version.
      - name: SonarCloud Scan
        if: ${{ !cancelled() && matrix.python-version == '3.14' && matrix.os == 'ubuntu-24.04' }}
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}