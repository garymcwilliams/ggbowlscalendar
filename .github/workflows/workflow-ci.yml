name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Add more OS versions here later, e.g. ubuntu-22.04, windows-latest
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so SonarQube can do blame/new-code analysis

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      # Cache the project's virtualenv, keyed on interpreter + lockfile.
      # Skipped automatically (cache miss) whenever the lockfile changes.
      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests
        run: |
          poetry run coverage run -m pytest \
            --junitxml=junit.xml \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml,./junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # Keep one matrix leg's reports around for the SonarQube job below,
      # since Sonar analysis only needs to run once per push/PR.
      - name: Upload reports for SonarQube
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: sonar-reports
          path: |
            coverage.xml
            junit.xml
          retention-days: 1

  sonarqube:
    name: SonarQube scan
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          name: sonar-reports

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
#          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}